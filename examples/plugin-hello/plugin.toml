id = "hello"
name = "Hello Reference Plugin"
version = "0.1.0"
runtime = "python"
entry = "run.py"
description = "Reference plugin for Tabula PluginRuntime smoke tests"

[[tools]]
name = "hello_ping"
description = "Return a greeting from the hello plugin"
deadline_ms = 5000

[[tools]]
name = "hello_spawn_child"
description = "Spawn a dummy child for child-process cleanup smoke tests"
deadline_ms = 5000

[[hooks]]
event = "before_tool_call"
priority = 50

[config.defaults]
greeting = "hello"

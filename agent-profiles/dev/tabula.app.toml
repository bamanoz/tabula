[application]
id = "code-immune-tabula-dev"
name = "Code Immune for Tabula Dev"

[distro]
source = "local:../../../tabula-distrib/code-immune"

[kernel]
url = "ws://127.0.0.1:8189/ws"

[[bindings.directory]]
root = "${project_root}/../.."

[values.workspace]
path = "${project_root}/../.."
extra_roots = ["${project_root}/../../../tabula-bundles", "${project_root}/../../../tabula-distrib"]

[values.prompt]
project_files = ["AGENTS.md"]
create_missing_project_files = false

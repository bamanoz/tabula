[application]
id = "code-immune-tabula-prod"
name = "Code Immune for Tabula Prod"

[distro]
source = "git+https://github.com/bamanoz/tabula-distrib.git@main#path=code-immune"

[kernel]
url = "ws://127.0.0.1:8089/ws"

[[bindings.directory]]
root = "${project_root}/../.."

[values.workspace]
path = "${project_root}/../.."

[values.prompt]
project_files = ["AGENTS.md"]
create_missing_project_files = false

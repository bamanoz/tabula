provider = "anthropic"

[openai]
model = "gpt-5.4"
base_url = "https://api.openai.com/v1"
api_key = { source = "store", id = "driver-openai.api_key" }

[anthropic]
model = "claude-sonnet-4-6"
base_url = "https://api.anthropic.com"
api_key = { source = "store", id = "driver-anthropic.api_key" }

[driver.mock]
subagent_count = 3
max_turns = 5
sleep_ms = 25
default_waves = 1

[gateway.api]
# provider_override = "openai"
# auth_token = { source = "store", id = "gateway-api.auth_token" }

[gateway.api.session]
idle_ttl = 900
max_age = 21600
cleanup_interval = 30

[gateway.telegram]
# provider_override = "openai"
api_timeout = 10
# bot_tokens = { source = "store", id = "gateway.telegram.bot_tokens" }

[gateway.telegram.session]
idle_ttl = 900
max_age = 21600
cleanup_interval = 30

[sessions]
idle_timeout = 300
poll_interval = 2

[hook.logger]
# log_file = "/Users/you/.tabula/logs/hook-logger/hooks.jsonl"

[mcp.pool]
url = ""
host = "0.0.0.0"
port = 0

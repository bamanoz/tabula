services:
  tabula:
    build:
      context: .
      dockerfile: Dockerfile
    image: tabula-agent:local
    init: true
    ports:
      - "18089:8089"
      - "18765:8765"
    environment:
      TABULA_HOME: /workspace/.tabula-docker
      TABULA_WORKSPACE: /workspace
      TABULA_APP_MANIFEST: /workspace/tabula.app.toml
      TABULA_UID: ${UID:-1000}
      TABULA_GID: ${GID:-1000}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    volumes:
      - .:/workspace
      - ../tabula-distrib:/tabula-distrib:ro
      - ../tabula-bundles:/tabula-bundles:ro
      - ~/.ssh:/host-ssh:ro

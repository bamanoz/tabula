[suites.baseline]
set = "baseline"
tests = ["tests/smoke.py"]
runtime_tenants = ["*"]

[suites.bundle-dependency-closure]
set = "empty"
bundles = ["dependency-fixture"]
tests = ["tests/test_bundle_dependency_closure.py"]

[suites.host-service]
set = "empty"
bundles = ["host-service-fixture"]
tests = ["tests/test_host_service.py"]

[suites.plugin-fixture-execution]
set = "extensions"
components = ["test-fixtures:testbed-cold-python", "test-fixtures:testbed-cold-bash", "test-fixtures:testbed-cold-node"]
tests = ["tests/test_plugin_fixture_execution.py"]

[suites.plugin-failure-modes]
set = "extensions"
components = ["test-fixtures:testbed-cold-python", "test-fixtures:testbed-cold-node", "test-fixtures:testbed-fail"]
tests = ["tests/test_skill_failure_modes.py"]

[suites.plugin-concurrency]
set = "extensions"
components = ["test-fixtures:testbed-cold-python"]
tests = ["tests/test_skill_concurrency.py"]

[suites.tenant-isolation]

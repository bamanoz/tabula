[sources.tabula-bundles]
source = "git+https://github.com/bamanoz/tabula-bundles.git@main"

[sets]
empty = []
baseline = ["base", "drivers", "files", "memory", "test-fixtures"]
base = ["base", "test-fixtures"]
caveman = ["base", "caveman", "test-fixtures"]
all = [
  "base",
  "drivers",
  "files",
  "memory",
  "caveman",
  "subagents",
  "code",
  "test-fixtures",
]

[bundles.base]
source = "source:tabula-bundles#path=base"

[bundles.drivers]
source = "source:tabula-bundles#path=drivers"

[bundles.files]
source = "source:tabula-bundles#path=files"

[bundles.memory]
source = "source:tabula-bundles#path=memory"

[bundles.caveman]
source = "source:tabula-bundles#path=caveman"

[bundles.subagents]
source = "source:tabula-bundles#path=subagents"

[bundles.code]
source = "source:tabula-bundles#path=code"

[bundles.test-fixtures]
source = "source:tabula-bundles#path=test-fixtures"

[suites.baseline]
set = "baseline"
tests = ["tests/smoke.py"]

[suites.mcp]
set = "empty"
components = ["base:mcp"]
tests = ["tests/test_mcp.py"]

[suites.cron]
set = "empty"
components = ["base:cron"]
tests = ["tests/test_cron.py"]

[suites.timer]
set = "empty"
components = ["base:timer"]
tests = ["tests/test_timer.py"]

[suites.shell]
set = "empty"
components = ["base:shell"]
tests = ["tests/test_shell.py"]

[suites.code]
set = "empty"
components = ["code:ask-user", "code:git", "code:hook-approvals", "code:hook-workspace-boundary", "code:review", "code:todo", "code:workspace"]
tests = ["tests/test_code.py"]

[suites.sessions]
set = "empty"
components = ["base:sessions"]
tests = ["tests/test_sessions.py"]

[suites.memory]
set = "empty"
components = ["memory:memory-save", "memory:memory-search", "memory:memory-admin"]
tests = ["tests/test_memory.py"]

[suites.files]
set = "empty"
components = ["files:files"]
tests = ["tests/test_files.py"]

[suites.subagents]
set = "empty"
components = ["base:sessions", "drivers:subagent", "subagents:subagents"]
tests = ["tests/test_subagents.py"]

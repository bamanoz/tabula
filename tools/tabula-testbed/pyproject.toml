[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tabula-testbed"
version = "0.1.0"
description = "Hermetic integration test runner for Tabula bundles, skills, plugins, clients, and distros."
requires-python = ">=3.11"
dependencies = [
  "websocket-client>=1.6",
]

[project.scripts]
tabula-testbed = "tabula_testbed_runner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tabula_testbed_runner = [
  "testbed_template/**/*",
]
